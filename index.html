<!DOCTYPE html>
<html lang="en" data-theme="light" data-density="comfortable">
  <head>
    <meta charset="utf-8" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <title>Clarity</title>
    <meta name="description" content="AI-powered answers grounded in your knowledge." />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/clarity-icon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/clarity-icon.png" />

    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/pages.css" />
  </head>

  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <div class="auth-root" id="authRoot" hidden></div>

    <div class="app" id="app" hidden>
      <!-- ================= SIDEBAR ================= -->
      <aside class="sidebar" id="sidebar" aria-label="Sidebar">
        <div class="sidebar__head">
          <a class="brand" href="#/" id="sidebarBrand" data-nav-home aria-expanded="true" aria-controls="sidebar">
            <span class="brand__mark" aria-hidden="true">
              <img class="brand__mark-img brand__mark-img--light" src="/clarity-icon.png" alt="" />
              <img class="brand__mark-img brand__mark-img--dark" src="/clarity-icon-white.png" alt="" />
            </span>
            <span class="brand__name">Clarity</span>
          </a>

            <button class="btn btn--ghost btn--icon-sm sidebar__collapse" id="sidebarCollapse" type="button" title="Collapse sidebar" data-tooltip="Collapse sidebar" aria-label="Collapse sidebar" aria-expanded="true" aria-controls="sidebar">
            <span class="sr-only">Collapse sidebar</span>
            <svg class="icon sidebar__collapse-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/><path d="m14 9 3 3-3 3"/></svg>
          </button>
        </div>

        <div class="sidebar__scroll" id="sidebarScroll">
          <div class="chat-sidebar__new" style="padding: 0 var(--s-3) var(--s-2);">
            <button class="btn btn--primary btn--sm w-full" id="sidebarNewChat" type="button" data-tooltip="New chat" title="New chat" aria-label="New chat">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px;flex:none;"><path d="M12 5v14M5 12h14"/></svg>
              <span>New chat</span>
            </button>
          </div>

          <nav class="nav" id="primaryNav" aria-label="Main"></nav>

          <div class="nav-section">
            <div class="nav-section__head">
              <span class="nav-section__title">Recent</span>
              <a class="nav-section__link" href="#/history">All</a>
            </div>
            <ul class="recent" id="recentList"></ul>
          </div>
        </div>

        <div class="sidebar__foot">
          <nav class="nav" id="secondaryNav" aria-label="Secondary"></nav>
        </div>
      </aside>

      <div class="scrim" id="scrim" hidden></div>

      <!-- ================= MAIN ================= -->
      <div class="shell">
        <header class="topbar">
          <button class="btn btn--ghost btn--icon-sm topbar__burger" id="topbarBurger" type="button" title="Open navigation" aria-label="Open navigation">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
          </button>
          <div class="crumbs">
            <span class="crumbs__root">Clarity</span>
            <span class="crumbs__ctx" id="crumbContext"></span>
          </div>

          <div class="topbar__right">
            <div class="model-chip" id="modelChip" title="Active model" role="button" tabindex="0" aria-haspopup="listbox">
              <span class="model-chip__name" id="modelChipLabel">Loading…</span>
            </div>

            <div class="dropdown" id="modelDropdown">
              <div class="dropdown__menu" id="modelSelectorDropdown" role="listbox" hidden></div>
            </div>

            <button class="btn btn--outline btn--sm" id="newChatBtn" type="button" title="Start a new chat">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              <span class="btn__text">New Chat</span>
            </button>

            <button class="btn btn--ghost btn--icon-sm topbar__theme-toggle" id="themeToggleBtn" type="button" title="Toggle theme" aria-label="Toggle theme">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            </button>

            <!-- Authenticated user: avatar with profile dropdown -->
            <button class="user-chip" id="userMenuBtn" type="button" aria-haspopup="menu" aria-expanded="false">
              <span class="avatar avatar--sm user-chip__avatar" id="userMenuAvatar" aria-hidden="true">
                <img id="userMenuAvatarImg" src="" alt="" style="display:none;" onerror="this.parentElement.classList.add('avatar--fallback'); this.parentElement.querySelector('.avatar__initials').style.display='flex';" />
                <span class="avatar__initials" id="userMenuInitial"></span>
              </span>
              <svg class="user-chip__chevron" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
            </button>

            <div class="dropdown-menu user-menu" id="userMenu" role="menu" hidden>
              <div class="user-menu__head">
                <div class="user-menu__profile">
                  <span class="avatar avatar--md user-menu__avatar" id="userMenuAvatarDropdown" aria-hidden="true">
                    <img id="userMenuAvatarImgDropdown" src="" alt="" style="display:none;" onerror="this.parentElement.classList.add('avatar--fallback'); this.parentElement.querySelector('.avatar__initials').style.display='flex';" />
                    <span class="avatar__initials" id="userMenuInitialDropdown"></span>
                  </span>
                  <div class="user-menu__info">
                    <span class="user-menu__name" id="userMenuName"></span>
                    <span class="user-menu__mail" id="userMenuEmailFull"></span>
                  </div>
                </div>
              </div>
              <div class="user-menu__sep" role="separator"></div>
              <button class="menu__item" type="button" role="menuitem" data-user-action="settings">
                <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
                <span>Settings</span>
              </button>
              <div class="menu__sep" role="separator"></div>
              <button class="menu__item menu__item--danger" type="button" role="menuitem" data-user-action="logout">
                <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
                <span>Sign out</span>
              </button>
            </div>
          </div>
        </header>

        <div class="body">
          <main class="main" id="main" tabindex="-1"></main>
          <aside class="source-panel" id="sourcePanel" aria-label="Source preview" aria-hidden="true"></aside>
        </div>
      </div>
    </div>

    <div class="toasts" id="toasts" role="region" aria-label="Notifications"></div>
    <div class="modal-root" id="modalRoot"></div>
    <div id="arch-mount" hidden></div>
    <div id="intelligence-mount" hidden></div>
    <div id="patch-mount" hidden></div>
    <div id="project-workspace-mount" hidden></div>

    <!-- Vite bundled entry (modules only; js/app.js owns the DOMContentLoaded bootstrap) -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
